name: Deploy server to Cloudflare

# Runs when api/ changes (or click "Run workflow"). Needs one repository secret,
# CLOUDFLARE_API_TOKEN (see docs/DEPLOY.md). Everything else is created automatically:
# the D1 database, migrations, the Durable Object, the VAPID keys and a workers.dev subdomain.
on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/deploy-api.yml']
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for a Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Skipped. Add the CLOUDFLARE_API_TOKEN repository secret to deploy the server (docs/DEPLOY.md)."
      - uses: actions/checkout@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: api
        run: npm ci
      - name: Unit tests
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: api
        run: npm test
      - name: Deploy (database, migrations, worker, secrets)
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: api
        run: node scripts/deploy.mjs
