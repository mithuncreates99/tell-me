# Tell Me push-reminder service (Cloudflare Worker)
# Docs: ../docs/DEPLOY.md
name = "tell-me-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
minify = true

# Runs every minute and sends any reminders that are due.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "tell-me"
# Replace with the id printed by `npx wrangler d1 create tell-me`
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# Public half of your VAPID key pair (from `npm run vapid`). The private half is a secret:
#   npx wrangler secret put VAPID_PRIVATE_KEY
VAPID_PUBLIC_KEY = "REPLACE_WITH_YOUR_VAPID_PUBLIC_KEY"
# How push services can reach you (must be https: or mailto:), e.g. your repo URL
VAPID_SUBJECT = "https://github.com/mithuncreates99/tell-me"
# Comma-separated list of web origins allowed to call the API, e.g. "https://you.github.io"
ALLOWED_ORIGINS = "*"
